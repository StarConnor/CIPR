storage: /cache/verdaccio/storage
plugins: /cache/verdaccio/plugins
web:
  title: redteam dependency cache
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@*/*':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
  '**':
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
server:
  keepAliveTimeout: 60
listen: 0.0.0.0:4873
logs:
  - {type: stdout, format: pretty, level: http}
