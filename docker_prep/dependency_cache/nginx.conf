user root;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 2048; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_ssl_server_name on;
    proxy_ssl_verify off;
    proxy_buffering on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 60s;
    proxy_cache_valid 200 206 301 302 24h;
    proxy_cache_valid 404 10m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;

    log_format cache '$remote_addr - $host "$request" $status $body_bytes_sent '
                     'upstream=$upstream_addr cache=$upstream_cache_status';
    access_log /dev/stdout cache;
    error_log /dev/stderr warn;

    proxy_cache_path /cache/nginx/maven levels=1:2 keys_zone=maven_cache:100m max_size=30g inactive=30d use_temp_path=off;
    proxy_cache_path /cache/nginx/go levels=1:2 keys_zone=go_cache:100m max_size=20g inactive=30d use_temp_path=off;
    proxy_cache_path /cache/nginx/cargo levels=1:2 keys_zone=cargo_cache:100m max_size=20g inactive=30d use_temp_path=off;
    proxy_cache_path /cache/nginx/rubygems levels=1:2 keys_zone=rubygems_cache:100m max_size=20g inactive=30d use_temp_path=off;
    proxy_cache_path /cache/nginx/packagist levels=1:2 keys_zone=packagist_cache:100m max_size=20g inactive=30d use_temp_path=off;

    server {
        listen 18082;
        server_name _;
        location / {
            proxy_cache maven_cache;
            proxy_set_header Host repo.maven.apache.org;
            proxy_pass https://repo.maven.apache.org/maven2/;
            add_header X-Dependency-Cache maven always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 3010;
        server_name _;
        location / {
            proxy_cache go_cache;
            proxy_set_header Host goproxy.cn;
            proxy_pass https://goproxy.cn/;
            add_header X-Dependency-Cache go always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 18083;
        server_name _;
        location / {
            proxy_cache cargo_cache;
            proxy_set_header Host index.crates.io;
            proxy_pass https://index.crates.io/;
            add_header X-Dependency-Cache cargo-sparse always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 9292;
        server_name _;
        location / {
            proxy_cache rubygems_cache;
            proxy_set_header Host rubygems.org;
            proxy_pass https://rubygems.org/;
            add_header X-Dependency-Cache rubygems always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    server {
        listen 18084;
        server_name _;
        location / {
            proxy_cache packagist_cache;
            proxy_set_header Host repo.packagist.org;
            proxy_pass https://repo.packagist.org/;
            add_header X-Dependency-Cache packagist always;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
