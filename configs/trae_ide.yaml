# GitHub Copilot Extension Configuration
# This config defines how to automate the GitHub Copilot VS Code extension
# Copilot is activated via keyboard shortcut: Ctrl+Alt+I

name: trae_ide
# pane_name: Copilot
display_name: Trae
version: "1.0"
driver: ide

export_dir: "C:\\Users\\${VM_WINDOWS_USER}\\Downloads"
executable_path: "C:\\Users\\${VM_WINDOWS_USER}\\AppData\\Local\\Programs\\Trae\\Trae.exe"
ide_server_folder: ""
# Activation method: keyboard shortcut instead of clicking a tab
activation_hotkey: "^%i"  # Ctrl+Alt+I in pywinauto format

ide_settings:
  remote.SSH.remotePlatform:
    docker-container: linux
  extensions.autoCheckUpdates: false
  extensions.autoUpdate: false
  update.enableWindowsBackgroundUpdates: false
  update.mode: "manual"
  update.showReleaseNotes: false
  extensions.ignoreRecommendations: true
  AI.toolcall.v2.ide.command.mode: alwaysRun
  AI.toolcall.v2.solo.command.mode: alwaysRun
  AI.toolcall.v2.ide.mcp.autoRun: alwaysRun

# ============================================================
# SELECTORS - Define how to locate UI elements
# ============================================================
selectors:

  # Input text area for sending messages
  input:
    criteria:
      title: "Plan, @ for context, / for commands"
    wait_timeout: 2

  retry_button:
    criteria:
      title: "Retry"
    wait_timeout: 1

  pick_model_button:
    criteria:
      title: "GPT-5-medium"
    wait_timeout: 1
  
  deepseek_chat_button:
    criteria:
      title: "deepseek/deepseek-v3.2"
    wait_timeout: 1

  gpt_5_1_codex_button:
    criteria:
      title: "openai/gpt-5.2-codex"
    wait_timeout: 1

  gemini_3_flash_preview_button:
    criteria:
      title: "google/gemini-3-flash-preview"
    wait_timeout: 1
  
  claude_sonnet_4_5_button:
    criteria:
      title: "Anthropic: Claude Sonnet 4.5"
    wait_timeout: 1
  
  trust_button:
    criteria:
      title: "Trust Folder & Continue"
    wait_timeout: 1
  
  root:
    criteria:
      xpath: "/*"
    wait_timeout: 3

  # =========
  # export
  # =========
  copy_all_button:
    criteria:
      title: "Copy All"
    wait_timeout: 1
  
  run_button:
    criteria:
      title: "Run"
    wait_timeout: 1
  
  delete_button:
    criteria:
      title: "Delete"
    wait_timeout: 1
  
  confirm_button:
    criteria:
      title: "Confirm"
    wait_timeout: 1
  
  run_anyway_button:
    criteria:
      title: "Run Anyway"
    wait_timeout: 1
  
# ============================================================
# WORKFLOWS - Multi-step operations with parameters
# ============================================================
workflows:

  # Prepare VS Code - start or connect to VS Code
  prepare_vscode:
    description: "Start VS Code or connect to an existing instance"
    parameters:
      - name: executable_path
        type: string
        required: false
        default: ""
      - name: workspace_path
        type: string
        required: false
        default: ""
    steps:
      - type: start_program
        executable: "{{executable_path}}"
        workspace: "{{workspace_path}}"
        wait_time: 40
        value: "Trae.exe"
        timeout: 40
        output: started
      # - type: keyboard
      #   target: root
      #   value: "#{UP}"
      - type: set_output
        key: ready
        value: "true"

  # Complete workflow: Send message, wait for completion, export and return history
  send_and_export:
    description: "Send a message, wait for completion, and export chat history"
    parameters:
      - name: message
        type: string
        required: true
      - name: timeout_seconds
        type: int
        default: 120
      - name: export_directory
        type: string
        default: "."
    steps:
      # First reconnect to the window (in case it changed after prepare_vscode)
      # - type: reconnect
      #   timeout: 30
      #   poll_interval: 2.0
      #   output: reconnected
      # # Wait for Copilot to be ready
      # --- POLL LOOP: STATUS/PROCESS BUTTON ---
      - type: time_mark
        output: status_wait_start

      - id: poll_input
        type: wait
        duration: 0.5

      - type: check_element
        target: trust_button
        output: int_trust
      
      - type: check_element_vision
        value: "C:\\automation_server_appium\\assets\\trae_input.png"
        output: input_found
      
      - type: jump_to
        target_id: poll_input
        condition: "input_found == False"

      - type: click
        target: pick_model_button
        optional: true
      
      - type: wait
        duration: 1

      - type: move_scroll
        x: 745 
        y: 341
        value: -1000
      
      - type: wait
        duration: 1

      - type: click
        target: <<model_button>>
        optional: true
      
      - type: wait
        duration: 1
      
      - type: direct_click
        x: 947
        y: 596

      - type: direct_input_without_clear
        value: "{{message}}"
      
      - type: time_mark
        output: start_time
      # --- LOOP START: WAIT FOR COMPLETION ---
      - id: poll_agent_state
        type: wait
        duration: 0.5
      
      - type: check_element
        target: delete_button
        output: has_delete_button
      
      - type: click
        target: delete_button
        when: "has_delete_button == True"
      
      - type: wait
        duration: 0.5
      
      - type: click
        target: confirm_button
        when: "has_delete_button == True"
        optional: true
      
      - type: check_element
        target: run_button
        output: has_run_button
      
      - type: click
        target: run_button
        when: "has_run_button == True"
      
      - type: wait
        duration: 0.5
      
      - type: click
        target: run_anyway_button
        when: "has_run_button == True"
        optional: true

      # 1. ALWAYS CHECK TIMEOUT FIRST
      - type: check_timeout
        start_time: start_time
        value: '6000'
        output: timed_out

      - type: jump_to
        target_id: handle_timeout_and_export
        condition: "timed_out == True"

      # 4. CHECK IF GENERATION STOPPED (Retry button appears when finished)
      - type: check_n_elements
        target: retry_button
        value: "n_retry_elements"
        output: is_finished

      # If still generating, go back to start
      - type: jump_to
        target_id: poll_agent_state
        condition: "is_finished == False"

      # 5. GENERATION STOPPED: IS THE TASK DONE?
      - type: check_task_end
        output: task_end

      # If Copilot is stuck/asking for info (Generation stopped but task not ended)
      - type: direct_input_without_clear
        value: "Please proceed according to your best judgement."
        when: "task_end == False"

      # After sending prompt, we must wait for new generation
      - type: jump_to
        target_id: poll_agent_state
        condition: "task_end == False"

      # 6. SUCCESS PATH (task_end is True)
      - type: jump_to
        target_id: export_chat

      # --- TIMEOUT HANDLER ---
      - id: handle_timeout_and_export
        type: click_element_vision
        value: "C:\\automation_server_appium\\assets\\trae_stop.png"

      - type: wait
        duration: 1.0
      # Fall through to export

      # --- EXPORT CHAT (Shared Logic) ---
      - id: export_chat
        type: copy_all
        target: copy_all_button

      - type: jump_to
        target_id: end
      
      - id: handle_failure
        type: log
        level: "error"
        value: "Workflow failed: Element not found or timeout reached."
      
      - id: end
        type: log
        level: "info"
        value: "Workflow completed successfully."
  

  # Close VS Code gracefully
  close_vscode:
    description: "Close VS Code gracefully"
    parameters:
      - name: force
        type: bool
        default: false
      - name: save_files
        type: bool
        default: false
    steps:
      - type: close_program
        value: "Trae.exe"
        force: "{{force}}"
        output: closed

# ============================================================
# STATE - Define how to query current UI state
# ============================================================
state:
  # Is the Copilot pane visible?
  is_active:
    method: is_visible
    target: pane

  # What's currently in the input box?
  current_input:
    method: get_text
    target: input

  # How many messages in the history?
  message_count:
    method: count_children
    target: history_container

  # Is Retry button visible (task finished)?
  is_task_finished:
    method: exists
    target: retry_button

  # Is command palette open?
  is_command_palette_open:
    method: exists
    target: command_palette_input
